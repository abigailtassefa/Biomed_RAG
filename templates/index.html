<!DOCTYPE html>

<html>

<head>

<title>
Biomedical Graph RAG
</title>

</head>


<body>


<h1>
Biomedical Knowledge Graph Assistant
</h1>


<input 
id="question"
size="60"
placeholder="Ask a biomedical question"
/>


<button onclick="askQuestion()">
Ask
</button>


<h3>
Answer:
</h3>


<p id="answer"></p>



<script>


async function askQuestion(){


let question =
document.getElementById("question").value;



let response =
await fetch("/ask",
{

method:"POST",

headers:
{
"Content-Type":"application/json"
},

body:
JSON.stringify(
{
question:question
}
)

});



let data =
await response.json();



document.getElementById("answer").innerHTML =
data.answer;


}


</script>


</body>

</html>
