<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Biomedical Graph RAG</title>
</head>

<body>
    <h1>Biomedical Knowledge Graph Assistant</h1>

    <input
        id="question"
        type="text"
        size="60"
        placeholder="Ask a biomedical question"
    >

    <button type="button" onclick="askQuestion()">
        Ask
    </button>

    <h3>Answer:</h3>

    <p id="answer"></p>

    <script>
        async function askQuestion() {
            const questionInput =
                document.getElementById("question");

            const answerElement =
                document.getElementById("answer");

            const question = questionInput.value.trim();

            // Check the input before contacting Flask.
            if (!question) {
                answerElement.textContent =
                    "Please enter a question.";
                return;
            }

            // Show feedback while the application is processing.
            answerElement.textContent = "Loading...";

            try {
                const response = await fetch("/ask", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })
                });

                const data = await response.json();

                // Display errors returned by Flask.
                if (!response.ok) {
                    answerElement.textContent =
                        data.error || "Something went wrong.";
                    return;
                }

                // Display successful answers as safe text.
                answerElement.textContent = data.answer;

            } catch (error) {
                // This runs if Flask cannot be reached or the
                // response cannot be processed.
                answerElement.textContent =
                    "Unable to connect to the application. Please try again.";
            }
        }
    </script>
</body>

</html>
